name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check-identity:
    name: Check Git Identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparar correos de commits contra .mailmap
        run: |
          set -e

          git log --format='%ae' origin/${{ github.base_ref }}..${{ github.sha }} \
            | sort -u > commit_emails.txt

          grep -oE '<[^>]+>' .mailmap \
            | tr -d '<>' \
            | sort -u > known_emails.txt

          unknown=$(comm -23 commit_emails.txt known_emails.txt)

          if [ -n "$unknown" ]; then
            echo "::error::Se encontraron commits con correos no registrados en .mailmap:"
            echo "$unknown"
            echo ""
            echo "Solución: agrega una línea al .mailmap con tu identidad canónica,"
            echo "o corre 'git config user.email' para usar un correo ya conocido."
            exit 1
          fi

          echo "Todos los correos de este PR están reconocidos en .mailmap."

  lint:
    name: Ruff F2 + F3
    needs: check-identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Ejecutar Ruff
        run: |
          uv run ruff check \
            F2/src F2/test \
            F3/src F3/test

  test-fast:
    name: Tests F2 + F3
    needs: check-identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Ejecutar tests rápidos
        run: uv run pytest F2/test F3/test -m "not slow" -v

  test-notebooks:
    name: Tests notebooks
    needs: check-identity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - run: uv run python -m ipykernel install --user --name python3

      - name: Ejecutar tests lentos
        run: uv run pytest -m slow -v