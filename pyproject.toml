[project]
name = "grupo-1-programacion-ciencia-de-datos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "zeep>=4.3.3",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
